services:
  postgres:
    image: postgres:16-alpine
    container_name: receiptflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receiptflow
      POSTGRES_USER: receiptflow
      POSTGRES_PASSWORD: receiptflow
    ports:
      - "5432:5432"
    volumes:
      - receiptflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptflow -d receiptflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  receiptflow_postgres_data:
